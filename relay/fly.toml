# Fly.io app spec for the Wingman relay.
# Deploy: scripts/deploy-relay.sh  (or: cd relay && fly launch --copy-config)
app = "wingman-relay"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  RELAY_LISTEN = ":8443"

[http_service]
  internal_port = 8443
  force_https = true
  # The relay holds the daemon's long-parked host connection; auto-stopping
  # the machine would sever it and force a redial loop.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
